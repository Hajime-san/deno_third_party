name: Build dav1d

on:
  push:
    branches:
      - add-dav1d
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os-name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux ---
          - os-name: linux
            runner: ubuntu-22.04
            arch: x86_64
            cc: gcc
            cxx: g++
          - os-name: linux
            runner: ubuntu-22.04-arm
            arch: aarch64
            cc: gcc
            cxx: g++

          # --- macOS ---
          - os-name: macos
            runner: macos-15-intel
            arch: x86_64
            cc: clang
            cxx: clang++
          - os-name: macos
            runner: macos-14
            arch: aarch64
            cc: clang
            cxx: clang++

          # --- Windows ---
          - os-name: windows
            runner: windows-2022
            arch: x86_64
            cc: clang-cl
            cxx: clang-cl
          - os-name: windows
            runner: windows-11-arm
            arch: aarch64
            cc: clang-cl
            cxx: clang-cl

    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6

      - name: Install NASM (x86_64 only)
        if: matrix.arch == 'x86_64'
        uses: ilammy/setup-nasm@v1

      - name: Install Python
        uses: actions/setup-python@4f41a90a1f38628c7ccc608d05fbafe701bc20ae # v6
        with:
          python-version: "3.x"

      - name: Install pip packages
        run: |
          pip install -U pip
          pip install -U wheel setuptools
          pip install -U meson ninja

      - name: Build dav1d
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          # Keep sync the version
          # https://github.com/rust-av/dav1d-rs/blob/03477a36c3de4f2aacbab81a8951150ffdb9c4c3/dav1d-sys/build.rs#L10
          git clone https://code.videolan.org/videolan/dav1d.git -b 1.5.0 --depth 1
          cd dav1d

          meson setup build \
            --buildtype release \
            --default-library static \
            -Denable_tools=false \
            -Denable_tests=false \
            --werror

          ninja -C build

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir -p dist/include/dav1d
          mkdir -p dist/lib

          # Standardize filenames to match system-deps expectations:
          # Windows (MSVC): Expects "dav1d.lib"
          # Unix-like (macOS/Linux): Expects "libdav1d.a"
          # https://github.com/gdesmott/system-deps/blob/f5592dd43672bcf0197f52f79f77b1144493e872/src/lib.rs#L1049-L1064
          if [[ "${{ matrix.os-name }}" == "windows" ]]; then
            cp dav1d/build/src/libdav1d.a dist/dav1d.lib
          else
            cp dav1d/build/src/libdav1d.a dist/libdav1d.a
          fi

      - name: Generate Attestations
        uses: actions/attest-build-provenance@6865550d0380db508fc599a58cc87c50c0bba5c5 # v3
        with:
          subject-path: "dist/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.os-name }}-dav1d-${{ matrix.arch }}
          path: dist/
